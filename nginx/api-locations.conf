# API yonlendirmeleri. Hem app.<domain> hem de gecis suresince kok <domain>
# tarafindan include edilir; iki blogun ayrisip birbirinden farklilasmamasi
# icin tek kopya tutulur.
#
# Not: ${SERVER_DOMAIN} gibi degisken kullanilmaz — bu dosya templates/ altinda
# degil dogrudan mount edilir, envsubst'tan gecmez.

# ── API Gateway (REST) ──
location / {
    proxy_pass http://apigateway:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── MessageService — SignalR WebSocket via API Gateway auth ──
location /messagehub {
    proxy_pass http://apigateway:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── PresenceService — SignalR WebSocket ──
location /hubs/presence {
