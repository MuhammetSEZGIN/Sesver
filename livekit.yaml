port: 7880
rtc:
  # docker-compose.yml tek UDP medya portu olarak 7882'yi yayımlar.
  # Buradaki aday ile host portu aynı olmazsa istemciler sinyalleşir fakat
  # medya için ICE bağlantısı kuramaz.
  udp_port: 7882
  use_external_ip: true
  tcp_port: 7881

redis:
  address: livekit-redis:6379

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info
  json: true

room:
  auto_create: true
  max_participants: 50
