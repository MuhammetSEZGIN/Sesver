services:
  identity-db:
    image: postgres:18-alpine
    container_name: sesver-local-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: IdentityDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - sesver_local_identity_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d IdentityDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  clan-db:
    image: postgres:18-alpine
    container_name: sesver-local-clan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ClanDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - sesver_local_clan_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ClanDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:18-alpine
    container_name: sesver-local-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: NotificationDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5434:5432"
    volumes:
      - sesver_local_notification_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d NotificationDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AuthenticationService (Java) — kendi ayrı Postgres'i, prod'daki auth-postgres ile aynı DB adı.
  auth-db:
    image: postgres:15-alpine
    container_name: sesver-local-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clan_roles_db
      POSTGRES_USER: my_db_user
      POSTGRES_PASSWORD: my_db_password
    ports:
      - "5435:5432"
    volumes:
      - sesver_local_auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_db_user -d clan_roles_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AuthenticationService'in application.yaml varsayılanı SPRING_DATA_REDIS_PORT=6380'i baz alır.
  auth-redis:
    image: redis:7-alpine
    container_name: sesver-local-auth-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  message-db:
    image: mongo:7
    container_name: sesver-local-message-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "1234"
    ports:
      - "27017:27017"
    volumes:
      - sesver_local_message_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sesver-local-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sesver-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sesver_local_session_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit-redis:
    image: redis:7-alpine
    container_name: sesver-local-livekit-redis
    restart: unless-stopped
    volumes:
      - sesver_local_livekit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: sesver-local-livekit-server
    restart: unless-stopped
    # WebRTC medya adayı tarayıcının erişebileceği host IP olmalıdır. Aynı
    # makinedeki gizlenmiş mDNS adaylarında bile 127.0.0.1 Docker container'ı
    # için güvenilir değildir; geliştiriciye özel değer .env'den gelir.
    command: ["--config", "/etc/livekit.local.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    volumes:
      - ./livekit.local.yaml:/etc/livekit.local.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      livekit-redis:
        condition: service_healthy

volumes:
  sesver_local_identity_db:
  sesver_local_notification_db:
  sesver_local_clan_db:
  sesver_local_auth_db:
  sesver_local_message_db:
  sesver_local_session_redis:
  sesver_local_livekit_redis:
